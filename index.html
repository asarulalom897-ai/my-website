<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मेरा पहला गेम</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 50px;
        }
        .game-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }
        input {
            padding: 10px;
            font-size: 16px;
            width: 100px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <h2>नंबर गेसिंग गेम 🎮</h2>
        <p>1 से 10 के बीच का कोई एक नंबर सोचें और यहाँ डालें:</p>
        <input type="number" id="userGuess" min="1" max="10">
        <br><br>
        <button onclick="checkGuess()">जांच करें</button>
        <p id="resultText" style="font-weight: bold; margin-top: 20px;"></p>
    </div>

    <script>
        // कंप्यूटर ने एक रैंडम नंबर चुना
        let randomNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {
            let userVal = Number(document.getElementById("userGuess").value);
            let result = document.getElementById("resultText");

            if (userVal === randomNumber) {
                result.style.color = "green";
                result.textContent = "बधाई हो! आपने बिल्कुल सही जवाब दिया है! 🎉";
            } else if (userVal > randomNumber) {
                result.style.color = "red";
                result.textContent = "थोड़ा छोटा नंबर सोचिए! 📉";
            } else {
                result.style.color = "red";
                result.textContent = "थोड़ा बड़ा नंबर सोचिए! 📈";
            }
        }
    </script>

</body>
</html>
